<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map & Geolocation App — Ala-Too College</title>
    <!-- Подключаем Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Шапка по дизайну Figma */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #d4931a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: white;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 500;
        }

        .menu-btn, .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* Выпадающее меню */
        .dropdown-menu {
            position: absolute;
            top: 60px;
            left: 0;
            background: white;
            width: 240px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.15);
            z-index: 20;
            display: none;
        }

        .dropdown-menu.active {
            display: block;
        }

        .menu-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            color: #333;
            cursor: pointer;
            font-size: 15px;
        }

        .menu-item:hover {
            background-color: #f5f5f5;
        }

        /* Нижняя карточка (Bottom Sheet) */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            z-index: 10;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            max-height: 45vh;
            overflow-y: auto;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background-color: #ccc;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            margin-left: 10px;
            font-size: 15px;
            width: 100%;
            color: #333;
        }

        .search-btn {
            background: #d4931a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            margin-left: 8px;
        }

        .places-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .place-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .place-item:hover {
            background-color: #fdf6e7;
        }

        .place-item:last-child {
            border-bottom: none;
        }

        .place-sub {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">&#9776;</button>
        <h1 id="pageTitle">Boarding Point</h1>
        <button class="action-btn" onclick="switchScreen()" title="Сменить режим">&#8635;</button>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-item" onclick="setScreen('Boarding Point')">📍 Boarding Point</div>
        <div class="menu-item" onclick="setScreen('Search Results')">🔍 Search Results</div>
    </div>

    <div id="map"></div>

    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
    </div>

    <!-- Подключаем Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Точные координаты зданий рядом с Колледжем Ала-Тоо (мкр. Тунгуч)
        const bishkekPlaces = [
            { name: "Колледж Ала-Тоо", address: "ул. Анкара 1/8, кампус Ала-Тоо", lat: 42.85595, lon: 74.68155, rating: "5.0" },
            { name: "Мечеть Имам Сарахси", address: "ул. Анкара / ул. Ауэзова", lat: 42.85865, lon: 74.67525, rating: "4.9" },
            { name: "Гипермаркет Глобус (Тунгуч)", address: "ул. Анкара 1/2", lat: 42.85485, lon: 74.67785, rating: "4.7" },
            { name: "Микрорайон Тунгуч (Остановка)", address: "ул. Анкара / мкр. Тунгуч", lat: 42.85540, lon: 74.68380, rating: "4.8" }
        ];

        // Инициализация карты прямо на здании колледжа
        const map = L.map('map', { zoomControl: false }).setView([42.85595, 74.68155], 16);

        // Используем бесплатные и надежные тайлы Esri World Street Map без ключей
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Taiwan), and the GIS User Community'
        }).addTo(map);

        let activeMarker = L.marker([42.85595, 74.68155]).addTo(map)
            .bindPopup('<b>Колледж Ала-Тоо</b><br>ул. Анкара 1/8, мкр. Тунгуч')
            .openPopup();

        let routeLine = null;

        // Перелет к месту + построение линии маршрута
        function goToPlace(lat, lon, name, address) {
            const currentPos = activeMarker.getLatLng();

            if (routeLine) {
                map.removeLayer(routeLine);
            }

            routeLine = L.polyline([currentPos, [lat, lon]], {
                color: '#d4931a',
                weight: 4
            }).addTo(map);

            activeMarker.setLatLng([lat, lon]);
            activeMarker.bindPopup(`<b>${name}</b><br>${address}`).openPopup();
            map.flyTo([lat, lon], 17);

            const routeInput = document.getElementById('routeInput');
            if (routeInput) {
                routeInput.value = `${name} (${address})`;
            }
        }

        // Поиск через Nominatim API
        async function searchAddress() {
            const query = document.getElementById('searchQuery').value.trim();
            const resultsContainer = document.getElementById('searchResultsList');
            if (!query) return;

            resultsContainer.innerHTML = `<div class="place-item">Поиск "${query}"...</div>`;

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    resultsContainer.innerHTML = `<div class="place-item">Ничего не найдено</div>`;
                    return;
                }

                resultsContainer.innerHTML = data.map(item => {
                    const shortName = item.display_name.split(',')[0];
                    const subAddress = item.display_name.split(',').slice(1, 3).join(',');
                    return `
                        <div class="place-item" onclick="goToPlace(${item.lat}, ${item.lon}, '${shortName.replace(/'/g, "")}', '${subAddress.replace(/'/g, "")}')">
                            <div>
                                <div>📍 <b>${shortName}</b></div>
                                <div class="place-sub">${subAddress}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                const first = data[0];
                goToPlace(first.lat, first.lon, first.display_name.split(',')[0], first.display_name);
            } catch (error) {
                resultsContainer.innerHTML = `<div class="place-item">Ошибка соединения с API поиска</div>`;
            }
        }

        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                document.getElementById('dropdownMenu').classList.remove('active');
            }
        }

        function setScreen(screenName) {
            document.getElementById('pageTitle').innerText = screenName;
            document.getElementById('dropdownMenu').classList.remove('active');
            const sheetContent = document.getElementById('sheetContent');

            if (screenName === 'Boarding Point') {
                const listHtml = bishkekPlaces.map(p => `
                    <div class="place-item" onclick="goToPlace(${p.lat}, ${p.lon}, '${p.name}', '${p.address}')">
                        <div>
                            <div>📍 <b>${p.name}</b></div>
                            <div class="place-sub">${p.address}</div>
                        </div>
                        <span style="color:#d4931a; font-weight:600;">★ ${p.rating}</span>
                    </div>
                `).join('');

                sheetContent.innerHTML = `
                    <div class="search-box">
                        <span>📍</span>
                        <input type="text" id="routeInput" readonly value="Колледж Ала-Тоо (ул. Анкара 1/8)">
                    </div>
                    <div class="places-title">Places Near You (мкр. Тунгуч)</div>
                    ${listHtml}
                `;
            } else if (screenName === 'Search Results') {
                sheetContent.innerHTML = `
                    <div class="search-box">
                        <span>🔍</span>
                        <input type="text" id="searchQuery" placeholder="Введите адрес или город..." value="Тунгуч Бишкек" onkeydown="if(event.key==='Enter') searchAddress()">
                        <button class="search-btn" onclick="searchAddress()">Найти</button>
                    </div>
                    <div class="places-title">Результаты поиска</div>
                    <div id="searchResultsList">
                        <div class="place-sub" style="padding: 10px;">Введите запрос выше для поиска...</div>
                    </div>
                `;
            }
        }

        function switchScreen() {
            const current = document.getElementById('pageTitle').innerText;
            if (current === 'Boarding Point') {
                setScreen('Search Results');
            } else {
                setScreen('Boarding Point');
            }
        }

        // Запуск при загрузке страницы
        setScreen('Boarding Point');
    </script>
</body>
</html>
