<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map & Geolocation App — Bishkek</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #d4931a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: white;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 500;
        }

        .menu-btn, .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .dropdown-menu {
            position: absolute;
            top: 60px;
            left: 0;
            background: white;
            width: 240px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.15);
            z-index: 20;
            display: none;
        }

        .dropdown-menu.active {
            display: block;
        }

        .menu-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            color: #333;
            cursor: pointer;
            font-size: 15px;
        }

        .menu-item:hover {
            background-color: #f5f5f5;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            z-index: 10;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
            max-height: 45vh;
            overflow-y: auto;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background-color: #ccc;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            margin-left: 10px;
            font-size: 15px;
            width: 100%;
            color: #333;
        }

        .search-btn {
            background: #d4931a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            margin-left: 8px;
        }

        .places-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .place-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .place-item:hover {
            background-color: #fdf6e7;
        }

        .place-item:last-child {
            border-bottom: none;
        }

        .place-sub {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">&#9776;</button>
        <h1 id="pageTitle">Boarding Point</h1>
        <button class="action-btn" onclick="switchScreen()" title="Сменить режим">&#8635;</button>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-item" onclick="setScreen('Boarding Point')">📍 Boarding Point</div>
        <div class="menu-item" onclick="setScreen('Search Results')">🔍 Search Results</div>
    </div>

    <div id="map"></div>

    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Реальные локации в Бишкеке
        const bishkekPlaces = [
            { name: "Площадь Ала-Тоо", address: "пр. Чуй, Бишкек", lat: 42.8765, lon: 74.6037, rating: "4.9" },
            { name: "ЦУМ Айчурек", address: "пр. Чуй 155, Бишкек", lat: 42.8758, lon: 74.6143, rating: "4.7" },
            { name: "Vefa Center", address: "ул. Байтик Баатыра 98, Бишкек", lat: 42.8576, lon: 74.6096, rating: "4.6" },
            { name: "Парк им. Панфилова", address: "ул. Фрунзе 370, Бишкек", lat: 42.8794, lon: 74.6012, rating: "4.8" }
        ];

        // Инициализация карты по центру Бишкека
        const map = L.map('map', { zoomControl: false }).setView([42.8765, 74.6037], 14);

        L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let activeMarker = L.marker([42.8765, 74.6037]).addTo(map)
            .bindPopup('<b>Площадь Ала-Тоо</b><br>пр. Чуй, Бишкек')
            .openPopup();

        let routeLine = null;

        // Перелет к выбранному месту + отрисовка маршрута от текущей точки
        function goToPlace(lat, lon, name, address) {
            const currentPos = activeMarker.getLatLng();

            if (routeLine) {
                map.removeLayer(routeLine);
            }

            // Рисуем линию маршрута как в макете Figma
            routeLine = L.polyline([currentPos, [lat, lon]], {
                color: '#d4931a',
                weight: 4
            }).addTo(map);

            activeMarker.setLatLng([lat, lon]);
            activeMarker.bindPopup(`<b>${name}</b><br>${address}`).openPopup();
            map.flyTo([lat, lon], 15);

            const routeInput = document.getElementById('routeInput');
            if (routeInput) {
                routeInput.value = `${name} (${address})`;
            }
        }

        // Реальный поиск через API Nominatim (OpenStreetMap Geocoding API)
        async function searchAddress() {
            const query = document.getElementById('searchQuery').value.trim();
            const resultsContainer = document.getElementById('searchResultsList');
            if (!query) return;

            resultsContainer.innerHTML = `<div class="place-item">Поиск "${query}"...</div>`;

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    resultsContainer.innerHTML = `<div class="place-item">Ничего не найдено</div>`;
                    return;
                }

                resultsContainer.innerHTML = data.map(item => {
                    const shortName = item.display_name.split(',')[0];
                    const subAddress = item.display_name.split(',').slice(1, 3).join(',');
                    return `
                        <div class="place-item" onclick="goToPlace(${item.lat}, ${item.lon}, '${shortName.replace(/'/g, "")}', '${subAddress.replace(/'/g, "")}')">
                            <div>
                                <div>📍 <b>${shortName}</b></div>
                                <div class="place-sub">${subAddress}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Сразу перелетаем на первый найденный результат
                const first = data[0];
                goToPlace(first.lat, first.lon, first.display_name.split(',')[0], first.display_name);
            } catch (error) {
                resultsContainer.innerHTML = `<div class="place-item">Ошибка соединения с API поиска</div>`;
            }
        }

        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                document.getElementById('dropdownMenu').classList.remove('active');
            }
        }

        function setScreen(screenName) {
            document.getElementById('pageTitle').innerText = screenName;
            document.getElementById('dropdownMenu').classList.remove('active');
            const sheetContent = document.getElementById('sheetContent');

            if (screenName === 'Boarding Point') {
                const listHtml = bishkekPlaces.map(p => `
                    <div class="place-item" onclick="goToPlace(${p.lat}, ${p.lon}, '${p.name}', '${p.address}')">
                        <div>
                            <div>📍 <b>${p.name}</b></div>
                            <div class="place-sub">${p.address}</div>
                        </div>
                        <span style="color:#d4931a; font-weight:600;">★ ${p.rating}</span>
                    </div>
                `).join('');

                sheetContent.innerHTML = `
                    <div class="search-box">
                        <span>📍</span>
                        <input type="text" id="routeInput" readonly value="Площадь Ала-Тоо (пр. Чуй, Бишкек)">
                    </div>
                    <div class="places-title">Places Near You (Бишкек)</div>
                    ${listHtml}
                `;
            } else if (screenName === 'Search Results') {
                sheetContent.innerHTML = `
                    <div class="search-box">
                        <span>🔍</span>
                        <input type="text" id="searchQuery" placeholder="Введите место в Бишкеке..." value="ЦУМ Бишкек" onkeydown="if(event.key==='Enter') searchAddress()">
                        <button class="search-btn" onclick="searchAddress()">Найти</button>
                    </div>
                    <div class="places-title">Search Results</div>
                    <div id="searchResultsList">
                        <div class="place-item" onclick="goToPlace(42.8758, 74.6143, 'ЦУМ Айчурек', 'пр. Чуй 155, Бишкек')">
                            <div>
                                <div>📍 <b>ЦУМ Айчурек</b></div>
                                <div class="place-sub">пр. Чуй 155, Бишкек</div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        let currentScreenIndex = 0;
        const screens = ['Boarding Point', 'Search Results'];
        function switchScreen() {
            currentScreenIndex = (currentScreenIndex + 1) % screens.length;
            setScreen(screens[currentScreenIndex]);
        }

        // Загружаем первый экран при старте
        setScreen('Boarding Point');
    </script>
</body>
</html>
